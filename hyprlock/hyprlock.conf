source = $HOME/.config/hypr/mocha.conf

# Define colors and fonts
$accent = $mauve
$accentAlpha = $mauveAlpha
$font = JetBrainsMono Nerd Font
$shadow_color = rgba(0, 0, 0, 0.5)

# Calculate responsive font sizes based on screen resolution
# This uses the hyprctl command to get screen dimensions and calculate proportional sizes
$screen_width = cmd[update:once] hyprctl monitors -j | jq '.[0].width'
$screen_height = cmd[update:once] hyprctl monitors -j | jq '.[0].height'
$scale_factor = cmd[update:once] echo "scale=3; if($screen_width > 1920) then $screen_width/1920 else 1.0 end" | bc

# Responsive font sizes
$time_font_size = cmd[update:once] echo "scale=0; 120*$scale_factor/1" | bc
$date_font_size = cmd[update:once] echo "scale=0; 30*$scale_factor/1" | bc
$greeting_font_size = cmd[update:once] echo "scale=0; 25*$scale_factor/1" | bc
$weather_font_size = cmd[update:once] echo "scale=0; 25*$scale_factor/1" | bc

# GENERAL
general {
  disable_loading_bar = false
  hide_cursor = true
  grace = 2
  no_fade_in = false
}

# BACKGROUND
background {
  monitor =
  path = $HOME/.config/background
  blur_passes = 3
  blur_size = 7
  noise = 0.0117
  contrast = 0.8916
  brightness = 0.8172
  vibrancy = 0.1696
  vibrancy_darkness = 0.0
  color = $base
}

# GREETING
label {
  monitor =
  text = Konnichiwa, $USER!
  color = $text
  font_size = $greeting_font_size
  font_family = $font
  position = 30, -30
  halign = left
  valign = top
  shadow_passes = 4
  shadow_size = 2
  shadow_color = $shadow_color
  shadow_offset = 0, 1
  animation = fade_in
  animation_delta = 2
  animation_curve = 0.5, 0, 0.5, 1
}

# TIME
label {
  monitor =
  text = $TIME
  color = $text
  font_size = $time_font_size
  font_family = $font
  position = 0, -100
  halign = center
  valign = center
  shadow_passes = 4
  shadow_size = 3
  shadow_color = $shadow_color
  shadow_offset = 0, 1
  animation = slide_down
  animation_delta = 3
  animation_curve = 0, 0.5, 0.5, 1
}

# DATE
label {
  monitor =
  text = cmd[update:43200000] date +"%A, %d %B %Y"
  color = $text
  font_size = $date_font_size
  font_family = $font
  position = 0, 30
  halign = center
  valign = center
  shadow_passes = 4
  shadow_size = 2
  shadow_color = $shadow_color
  shadow_offset = 0, 1
  animation = slide_up
  animation_delta = 3
  animation_curve = 0, 0.5, 0.5, 1
}

# USER AVATAR WITH GLOW EFFECT
image {
  monitor =
  path = $HOME/.face
  size = cmd[update:once] echo "scale=0; 120*$scale_factor/1" | bc
  border_size = 4
  border_color = $accent
  rounding = -1
  position = 0, -250
  halign = center
  valign = center
  shadow_passes = 5
  shadow_size = 5
  shadow_color = $accentAlpha
  shadow_offset = 0, 0
  animation = bounce
  animation_delta = 2
  animation_curve = 0, 0.5, 0.2, 1.2
}

# INPUT FIELD
input-field {
  monitor =
  size = 350, 60
  outline_thickness = 3
  dots_size = 0.2
  dots_spacing = 0.2
  dots_center = true
  outer_color = $accent
  inner_color = $surface0
  font_color = $text
  fade_on_empty = true
  placeholder_text = <span foreground="##$textAlpha"><i>󰌾 Enter password for </i><span foreground="##$accentAlpha">$USER</span></span>
  hide_input = false
  check_color = $green
  fail_color = $red
  fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
  capslock_color = $yellow
  position = 0, 120
  halign = center
  valign = center
  shadow_passes = 3
  shadow_size = 2
  shadow_color = $shadow_color
  shadow_offset = 0, 1
  animation = slide_up
  animation_delta = 2
  animation_curve = 0, 0.5, 0.5, 1
}

# WEATHER
label {
  monitor =
  text = cmd[update:1800000] echo "$(curl -s 'wttr.in?format=%c+%t+%h' | tr -d '+')"
  color = $text
  font_size = $weather_font_size
  font_family = $font
  position = 0, -30
  halign = center
  valign = bottom
  shadow_passes = 4
  shadow_size = 2
  shadow_color = $shadow_color
  shadow_offset = 0, 1
  animation = fade_in
  animation_delta = 3
  animation_curve = 0, 0.5, 0.5, 1
}

# QUOTE
label {
  monitor =
  text = cmd[update:43200000] fortune -s | head -n 1
  color = $text
  font_size = cmd[update:once] echo "scale=0; 16*$scale_factor/1" | bc
  font_family = $font
  position = 0, -80
  halign = center
  valign = bottom
  shadow_passes = 3
  shadow_size = 1
  shadow_color = $shadow_color
  shadow_offset = 0, 1
  animation = fade_in
  animation_delta = 4
  animation_curve = 0, 0.5, 0.5, 1
}